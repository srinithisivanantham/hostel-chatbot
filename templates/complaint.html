<!DOCTYPE html>
<html>
<head>
    <title>Complaint Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="complaint-page">

<h2>Complaint Form</h2>

<form method="POST" action="/submit_complaint">

    <label>Register Number</label>
    <input type="text" name="register_no" id="regno" required onblur="fetchStudent()">

    <input type="hidden" id="name">
    <input type="hidden" id="phone">

    <label>Complaint</label>
    <textarea name="complaint" required></textarea>

    <input type="submit" value="Submit Complaint">

</form>

<script>
function fetchStudent(){
    let reg = document.getElementById("regno").value;

    if(reg.trim() === "") return;

    fetch("/get_student/" + reg)
    .then(res => res.json())
    .then(data => {
        if(data.error){
            alert("Invalid Register Number");
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
        } else {
            document.getElementById("name").value = data.name;
            document.getElementById("phone").value = data.phone;
        }
    });
}
</script>

</body>
</html>
