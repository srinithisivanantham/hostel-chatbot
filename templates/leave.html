<!DOCTYPE html>
<html>
<head>
    <title>Leave Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="leave-page">

<h2>Leave Application</h2>

<form method="POST" action="/submit_leave">

    <label>Register Number</label>
    <input type="text" name="register_no" id="regno" required onblur="fetchStudent()">

    <label>Student Name</label>
    <input type="text" id="name" readonly>

    <label>Phone Number</label>
    <input type="text" id="phone" readonly>

    <label>Reason</label>
    <textarea name="reason" required></textarea>

    <label>From Date</label>
    <input type="date" name="from_date" required>

    <label>To Date</label>
    <input type="date" name="to_date" required>

    <input type="submit" value="Submit Leave">

</form>

<script>
function fetchStudent(){
    let reg = document.getElementById("regno").value;

    if(reg.trim() === "") return;

    fetch("/get_student/" + reg)
    .then(res => res.json())
    .then(data => {
        if(data.error){
            alert("Invalid Register Number");
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
        } else {
            document.getElementById("name").value = data.name;
            document.getElementById("phone").value = data.phone;
        }
    });
}
</script>

</body>
</html>
